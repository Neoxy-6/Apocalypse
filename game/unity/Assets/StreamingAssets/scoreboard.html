<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>總排名</title>
<style>
:root{--bg:#1d1b1c;--card:#262324;--line:#363132;--dim:#8f8788;--gold:#ffd166;--red:#e07a7a;--green:#7fc98f}
body{margin:0;padding:16px;background:var(--bg);color:#eee;font-family:system-ui,"Microsoft JhengHei",sans-serif}
h1{margin:0 0 16px;font-size:30px}h2{font-size:18px;margin:28px 0 8px;color:#ccc}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.stat{background:var(--card);padding:10px 16px;min-width:110px;border-radius:6px}
.stat b{display:block;font-size:26px;color:var(--gold)}.stat span{font-size:13px;color:var(--dim)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:18px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--dim);font-weight:normal;font-size:14px}
td.l,th.l{text-align:left}td.total{font-weight:bold;color:var(--gold)}
tr.p{cursor:pointer}tr.p:hover{background:#2c2829}
tr.top td:first-child{color:var(--gold);font-weight:bold}
.none{color:#555}.esc{color:var(--green)}
tr.detail>td{background:#191718;padding:10px 12px 16px 36px;border-left:3px solid var(--gold)}
table.dt{width:auto;font-size:15px;border:1px solid #3d3738}
table.dt th,table.dt td{padding:6px 14px;min-width:44px;text-align:left;border:1px solid #3d3738}
table.dt th{background:#2e2a2b;color:#ddd;font-size:14px}
table.dt th.grp{background:#352f30;color:var(--gold);font-size:13px}
table.dt tbody tr:nth-child(even) td{background:#211e1f}
table.dt tr.sum td{background:#2e2a2b;font-weight:bold;color:var(--gold)}
table.dt td.k{color:#ff9b8a;font-weight:bold}table.dt td.e{color:#8fd3ff;font-weight:bold}
table.dt .zero{color:#555;font-weight:normal}table.dt .neg{color:var(--red)}
.won{color:var(--green)}.lost{color:var(--red)}
</style></head><body>
<h1>總排名</h1>
<div class="stats" id="stats"></div>

<div class="scroll"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>

<h2>場次</h2>
<div class="scroll"><table><thead><tr><th class="l">場次</th><th class="l">結束時間</th><th>seed</th><th>結果</th><th class="l">結束原因</th><th>人數</th><th>逃出</th><th>最高分</th><th class="l">第一名</th></tr></thead><tbody id="mb"></tbody></table></div>


<script>
const open = new Set();
let data = null;
const $ = id => document.getElementById(id);

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const sum = a => a.reduce((x, y) => x + y, 0);
const fmtT = s => (s || '').replace('T', ' ').slice(5, 16);
const stateName = {active:'存活', escaped:'逃出', evacuated:'撤離', eliminated:'淘汰', downed:'倒地'};

// 分數來源（伺服器 Pts），從來沒出現過的項目不顯示
const PTS = [['pts_part', '零件'], ['pts_fuel', '油桶'], ['pts_incident', '事件'], ['pts_kill', '擊殺'], ['pts_rescue', '救援'], ['pts_revive', '扶起'],
             ['pts_set', '套件獎勵'], ['pts_delivery', '配送'], ['pts_escape', '逃出獎金'], ['pts_down', '倒地扣分']];
const CNT = [['kills', '擊殺'], ['incidents', '事件'], ['revives', '扶起'], ['downs', '倒地']];
let ptCols = PTS;

function toggle(n) { open.has(n) ? open.delete(n) : open.add(n); render(); }

// 名字開頭有號碼（「7 - 小明」「07.小明」「7 小明」）就用號碼認人，名字每場改也會加在一起；沒有號碼就照完整名字
function keyOf(name) {
  const s = String(name || '').trim(), m = s.match(/^0*(\d+)\s*[.．。、,，:：\-_ ]/);
  return m ? '#' + (+m[1]) : s;
}

function build(d) {
  const ms = d.matches, roster = d.roster || [];
  // 舊版存的紀錄沒有分數來源明細，全部是 0
  ms.forEach(m => m.ranking.forEach(r => { r.noPts = r.score !== 0 && PTS.every(([k]) => !r[k]); }));
  const rkeys = roster.map(keyOf);
  const counted = r => roster.length ? rkeys.includes(keyOf(r.name)) : !r.bot;
  let keys = [...new Set(rkeys)];
  if (!keys.length) ms.forEach(m => m.ranking.forEach(r => { const k = keyOf(r.name); if (counted(r) && !keys.includes(k)) keys.push(k); }));
  const players = keys.map(k => {
    const per = ms.map(m => m.ranking.find(r => keyOf(r.name) === k) || null);
    const got = per.filter(x => x);
    // 同一個號碼名字可能每場不一樣，顯示最後一場用的名字
    const name = got.length ? got[got.length - 1].name.trim() : roster[rkeys.indexOf(k)];
    return {key: k, name, per, played: got.length,
      total: sum(got.map(r => r.score)),
      escaped: got.filter(r => r.escaped).length,
      best: got.length ? Math.min(...got.map(r => r.rank)) : null,
      avgRank: got.length ? sum(got.map(r => r.rank)) / got.length : null,
      downs: sum(got.map(r => r.downs)), revives: sum(got.map(r => r.revives)),
      rescued: sum(got.map(r => r.rescued)), parts: sum(got.map(r => r.parts)),
      kills: sum(got.map(r => r.kills || 0)), incidents: sum(got.map(r => r.incidents || 0)), fuel: sum(got.map(r => r.fuel || 0)),
      ...Object.fromEntries(PTS.map(([k]) => [k, sum(got.map(r => r[k] || 0))])), noPts: got.length > 0 && got.every(r => r.noPts)};
  });
  players.sort((a, b) => b.total - a.total || (a.avgRank ?? 99) - (b.avgRank ?? 99) || a.name.localeCompare(b.name));
  let rank = 0, prev = null;
  players.forEach((p, i) => { if (p.total !== prev) { rank = i + 1; prev = p.total; } p.rank = rank; });
  return {ms, players, roster};
}

function render() {
  if (!data) return;
  const {ms, players, roster} = build(data);
  const all = players.flatMap(p => p.per.filter(x => x));
  ptCols = PTS.filter(([k]) => all.some(r => r[k]));
  if (!ptCols.length) ptCols = PTS.slice(0, 6);
  $('stats').innerHTML = [
    [ms.length, '場數'],
    [players.length, roster.length ? '名單人數' : '參賽人數'],
    [`${ms.filter(m => m.class_won).length}/${ms.length}`, '勝場'],
    [all.filter(r => r.escaped).length, '逃出人數'],
    [sum(all.map(r => r.kills || 0)), '總擊殺'],
    [sum(all.map(r => r.incidents || 0)), '完成事件'],
    [sum(all.map(r => r.downs)), '倒地次數'],
    [sum(all.map(r => r.revives)), '扶起隊友'],
    [players.length ? players[0].total : 0, '目前最高總分'],
  ].map(([v, t]) => `<div class="stat"><b>${v}</b><span>${t}</span></div>`).join('');

  $('th').innerHTML = '<tr><th>#</th><th class="l">名字</th>' + ms.map((m, i) => `<th>第${i + 1}場</th>`).join('')
    + '<th>總分</th><th>場數</th><th>平均名次</th><th>最佳</th><th>逃出</th></tr>';
  const cols = ms.length + 7;
  $('tb').innerHTML = players.map(p => {
    let h = `<tr class="p${p.rank <= 3 ? ' top' : ''}" data-n="${esc(p.key)}" onclick="toggle(this.dataset.n)"><td>${p.rank}</td><td class="l">${open.has(p.key) ? '▾' : '▸'} ${esc(p.name)}</td>`
      + p.per.map(r => r ? `<td${r.escaped ? ' class="esc"' : ''}>${r.score}</td>` : '<td class="none">—</td>').join('')
      + `<td class="total">${p.total}</td><td>${p.played}</td><td>${p.avgRank == null ? '—' : p.avgRank.toFixed(1)}</td><td>${p.best ?? '—'}</td><td>${p.escaped}</td></tr>`;
    if (open.has(p.key)) {
      const n = v => v ? v : `<span class="zero">0</span>`;
      const pt = (r, k) => r.noPts ? '<span class="zero">—</span>' : r[k] < 0 ? `<span class="neg">${r[k]}</span>` : r[k] > 0 ? `+${r[k]}` : n(0);
      const row = r => ptCols.map(([k]) => `<td>${pt(r, k)}</td>`).join('') + CNT.map(([k]) => `<td>${n(r[k] || 0)}</td>`).join('');
      h += `<tr class="detail"><td colspan="${cols}"><table class="dt"><thead>`
        + `<tr><th class="grp" colspan="5">每場結果</th><th class="grp" colspan="${ptCols.length}">分數</th><th class="grp" colspan="${CNT.length}">次數</th></tr>`
        + `<tr><th>場次</th><th>名次</th><th>分數</th><th>結果</th><th>存活秒數</th>` + ptCols.map(([, t]) => `<th>${t}</th>`).join('') + CNT.map(([, t]) => `<th>${t}</th>`).join('') + `</tr></thead><tbody>`
        + p.per.map((r, i) => r ? `<tr><td>第${i + 1}場</td><td>${r.rank}</td><td><b>${r.score}</b></td><td>${r.escaped ? '<span class="esc">逃出</span>' : esc(stateName[r.state] || r.state)}</td><td>${Math.round(r.survived)}</td>${row(r)}</tr>`
                                : `<tr><td>第${i + 1}場</td><td colspan="${4 + ptCols.length + CNT.length}" class="none">沒參加</td></tr>`).join('')
        + `<tr class="sum"><td>合計</td><td>—</td><td>${p.total}</td><td>逃出 ${p.escaped} 次</td><td>—</td>${row(p)}</tr></tbody></table></td></tr>`;
    }
    return h;
  }).join('') || `<tr><td colspan="${cols}" class="none l">還沒有比賽結果</td></tr>`;

  $('mb').innerHTML = ms.map((m, i) => {
    const counted = m.ranking.filter(r => roster.length ? roster.map(keyOf).includes(keyOf(r.name)) : !r.bot);
    const top = counted.reduce((a, r) => !a || r.score > a.score ? r : a, null);
    return `<tr><td class="l">第${i + 1}場</td><td class="l">${fmtT(m.finished_at)}</td><td>${m.seed}</td><td>${m.class_won ? '<span class="won">撤離成功</span>' : '<span class="lost">撤離失敗</span>'}</td>`
      + `<td class="l">${esc(m.end_reason)}</td><td>${counted.length}</td><td>${counted.filter(r => r.escaped).length}</td><td>${top ? top.score : '—'}</td><td class="l">${top ? esc(top.name) : '—'}</td></tr>`;
  }).join('') || '<tr><td colspan="9" class="none l">還沒有</td></tr>';

}

async function refresh() {
  try { data = await (await fetch('/scoreboard/data')).json(); render(); }
  catch (e) {}  // 連不到就保留上一次的資料，下一輪再試
}
refresh(); setInterval(refresh, 3000);
</script>
</body></html>
